<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Acme Demo Shop (fictional)</title>
<style>body{font:16px system-ui;margin:0;background:#f6f7fb;color:#111}header{background:#1e293b;color:#fff;padding:14px 24px;display:flex;justify-content:space-between}
main{max-width:720px;margin:24px auto;padding:0 16px}.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 4px #0001}
button{background:#2563eb;color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:15px;cursor:pointer}button:disabled{opacity:.5}
input{padding:10px;border:1px solid #cbd5e1;border-radius:8px;width:100%;margin:6px 0 12px;font-size:15px}#msg{color:#b91c1c;min-height:22px}small{color:#64748b}</style></head>
<body><header><b>Acme Demo Shop</b><a id="cartlink" href="#" style="color:#fff">Cart (<span id="n">0</span>)</a></header>
<main>
<div class="card" id="lamp"><h2>Desk Lamp</h2><p>Warm light, USB powered. Price: 29 demo coins.</p><button class="add" id="add">Add to cart</button></div>
<form class="card" id="checkout"><h2>Checkout</h2><label>Email<input id="email" name="email" type="email" placeholder="demo.user@example.test"></label>
<label>Card number<input id="card" name="card" autocomplete="cc-number" placeholder="Fictional card, any digits"></label>
<button type="button" id="pay">Pay now</button><p id="msg" role="alert"></p><small>Fictional demo shop. Nothing is purchased.</small></form>
</main>
<script>
let n=0;
document.getElementById('add').onclick=async()=>{await fetch('/api/cart',{method:'POST'});n++;document.getElementById('n').textContent=n};
document.getElementById('pay').onclick=async()=>{
  const b=document.getElementById('pay');b.disabled=true;b.textContent='Paying...';
  try{const r=await fetch('/api/charge',{method:'POST'});
    if(!r.ok)throw new Error('Charge failed: upstream '+r.status+' (demo)');
    location.href='/thanks.html';
  }catch(e){document.getElementById('msg').textContent='Payment failed. Try again.';console.error(e.message)}
  finally{b.disabled=false;b.textContent='Pay now'}
};
</script></body></html>
